spring:
  application:
    name: schemapilot-backend
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  flyway:
    enabled: ${SCHEMAPILOT_FLYWAY_ENABLED:false}

server:
  port: ${SCHEMAPILOT_SERVER_PORT:8080}

schemapilot:
  database:
    metadata-url: ${SCHEMAPILOT_DB_URL:}
