spring:
  application:
    name: schemapilot-backend
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: ${SCHEMAPILOT_DB_URL:jdbc:postgresql://localhost:5432/schemapilot}
    username: ${SCHEMAPILOT_DB_USERNAME:schemapilot}
    password: ${SCHEMAPILOT_DB_PASSWORD:schemapilot}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SCHEMAPILOT_BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

schemapilot:
  ai:
    enabled: false
    mode: local-first
    local:
      endpoint: ${SCHEMAPILOT_LOCAL_LLM_ENDPOINT:http://localhost:11434}
      model: ${SCHEMAPILOT_LOCAL_LLM_MODEL:qwen2.5-coder:latest}
      knowledge-base: local-rag
    cloud:
      enabled: false
  migration:
    off-heap-memory-limit: 512MB
